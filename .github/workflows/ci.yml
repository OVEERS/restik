name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    # чистый Postgres, который поднимается на время проверки
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: restaurant
          POSTGRES_PASSWORD: restaurant
          POSTGRES_DB: restaurant
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U restaurant"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+asyncpg://restaurant:restaurant@localhost:5432/restaurant
      TEST_DATABASE_URL: postgresql+asyncpg://restaurant:restaurant@localhost:5432/restaurant_test
      SECRET_KEY: ci-secret-key-not-for-production-1234567890


    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Установка зависимостей
        run: pip install -r requirements-dev.txt

      - name: Миграции на чистой базе
        run: alembic upgrade head

      - name: Модели и миграции совпадают
        run: alembic check

      - name: Тесты
        run: pytest -v